[package]
name = "diffviewer-git"
version = "0.1.0"
edition = "2021"

[lib]
name = "diffviewer_git"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.100"
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
jni = { version = "0.21.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.47", features = ["formatting"] }

[dev-dependencies]
tempfile = "3.23.0"
